# omacosy-bar layout. Machine-specific values (airpods-name) go in
# bar-items.local.conf, which install.sh writes and git ignores.
hide bluetooth
hide weather
hide activity
group wifi volume battery airpods
group brightness caffeinate
media-controls off
workspaces-max 5
proxy-speed on
fission-estimator ~/.config/omacosy/scripts/fission_fund_estimator.js
weather-script ~/.config/omacosy/scripts/weather_popup.sh
weather-lib ~/.config/omacosy/scripts
ai-usage-script ~/.config/omacosy/scripts/ai_usage_popup.sh
ai-providers claude
codexbar ~/.config/omacosy/scripts/omp_usage.py
airpods-name AirPods
caffeinate on
lyrics-daemon ~/.config/omacosy/scripts/now_playing_daemon.py
media-source mpd
