# App choices for keybindings. Override in config/apps.local.conf
# (gitignored) — same KEY=Value lines — then re-run install.sh.
TERMINAL=Ghostty
# BROWSER and EMAIL are unset on purpose: the browser chord and
# omacosy-open follow the macOS default web browser and mail app. Set
# either to an app name here or in config/apps.local.conf to pin it.
MESSENGER=Slack
NOTES=Logseq
MESSAGES=Messages
ELEMENT=Element
