# omacosy-bar layout (captain decisions 2026-08-29)
hide bluetooth
hide weather
hide activity
group wifi volume battery airpods
group brightness caffeinate
media-controls off
workspaces-max 5
proxy-speed on
weather-script ~/.config/omacosy/scripts/weather_popup.sh
weather-lib ~/.config/omacosy/scripts
ai-usage-script ~/.config/omacosy/scripts/ai_usage_popup.sh
codexbar ~/.config/omacosy/scripts/codexbar_omp.sh
airpods-name AirPods
caffeinate on
lyrics-daemon ~/.config/omacosy/scripts/now_playing_daemon.py
media-source mpd
