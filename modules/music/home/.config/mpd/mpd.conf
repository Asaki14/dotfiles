# mpd —— 曲库在 ~/Music/lib，由 beets 维护；运行态文件放 ~/.local/share/mpd
music_directory     "~/Music/lib"
# playlist_directory 是软链，指向本仓库的 mpd/playlists（由 mpd/playlist-sync 建立并同步）
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
state_file          "~/.local/share/mpd/state"
sticker_file        "~/.local/share/mpd/sticker.sql"
log_file            "~/.local/share/mpd/mpd.log"

bind_to_address     "127.0.0.1"
port                "6600"
# rmpc 走 unix socket：mpd 只允许 socket 客户端 add 曲库外的本地文件（YouTube 缓存）
bind_to_address     "~/.local/share/mpd/socket"
restore_paused      "yes"

audio_output {
    type    "osx"
    name    "CoreAudio"
    mixer_type "software"
}

# rmpc 的 cava 频谱从这个 fifo 读 PCM；路径须与 rmpc/config.ron 的 cava.input.source 一致
# 采样率须与曲库一致（YouTube 下载的 opus 恒为 48000）：设成 44100 时 fifo 输出要重采样，
# 实测 CoreAudio 每 30 秒欠载约 30 次（歌曲卡顿），改 48000 后为 0
audio_output {
    type    "fifo"
    name    "cava"
    path    "/tmp/mpd.fifo"
    format  "48000:16:2"
}
